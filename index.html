<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finanças da Casa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#F2F5F3">
<style>
/* Layout: coluna única de celular. Cabeçalho com status de sincronização, conteúdo da aba, botão "+ Lançar" flutuante e barra de abas embaixo. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface2:#F7F9F8; --line:#DCE3DF; --fg:#17211D; --muted:#5D6B65;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --accent-soft:#DDEFE9;
  --pix:#0E7C86; --pix-soft:#DDF1F2; --cred:#6A4BB5; --cred-soft:#ECE6F8;
  --save:#2F7D3A; --save-soft:#E2F2E4; --warn:#A86200; --warn-soft:#FCEFD9;
  --danger:#B3261E; --danger-soft:#FBE4E2; --free:#C9D4CF;
  --pa:#2F5DA8; --pb:#B0427A;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --surface2:#1D2723; --line:#2B3632; --fg:#E5EDE9; --muted:#97A7A0;
  --accent:#4FC2A8; --accent-ink:#0B1A16; --accent-soft:#16312B;
  --pix:#4CC3CC; --pix-soft:#143236; --cred:#A88BEA; --cred-soft:#2A2340;
  --save:#6FCB7B; --save-soft:#183322; --warn:#F0A640; --warn-soft:#3A2A12;
  --danger:#F2867E; --danger-soft:#3D1D1B; --free:#3A4742;
  --pa:#82A7EC; --pb:#E58AB8; --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c;--c7:#9085e9;--c8:#e66767; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --surface2:#1D2723; --line:#2B3632; --fg:#E5EDE9; --muted:#97A7A0;
  --accent:#4FC2A8; --accent-ink:#0B1A16; --accent-soft:#16312B;
  --pix:#4CC3CC; --pix-soft:#143236; --cred:#A88BEA; --cred-soft:#2A2340;
  --save:#6FCB7B; --save-soft:#183322; --warn:#F0A640; --warn-soft:#3A2A12;
  --danger:#F2867E; --danger-soft:#3D1D1B; --free:#3A4742;
  --pa:#82A7EC; --pb:#E58AB8; --c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#0ca30c;--c7:#9085e9;--c8:#e66767; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid transparent}
header.top h1{font-size:1.25rem;margin:0;letter-spacing:-.01em}
.sync{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;max-width:58vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--save)} .sync.erro i,.sync.entrar i{background:var(--warn)} .sync.busy i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sync.busy i{animation:none}}

main{max-width:640px;margin:0 auto;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(150px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
h2{font-size:1.02rem;margin:0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-weight:500;color:var(--muted);font-size:.85rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.85rem}
section{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.flat{padding:4px 14px}

.mesbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px}
.mesbar strong{font-size:1.05rem;text-transform:capitalize}
.icon{width:44px;height:44px;border:none;background:transparent;border-radius:10px;font-size:1.4rem;color:var(--muted)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.hero .big{font-size:2.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .big.neg{color:var(--danger)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--free);gap:2px}
.stack span{display:block;height:100%;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}

ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
ul.list li:last-child{border-bottom:none}
.li-main{flex:1;min-width:0;background:none;border:none;padding:0;text-align:left;display:flex;flex-direction:column}
.li-main .t{overflow-wrap:anywhere}
.li-main small{color:var(--muted);font-size:.8rem}
.li-val{white-space:nowrap;font-weight:600}
.li-val.pos{color:var(--save)}
.chk{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:.9rem;color:transparent;padding:0}
.chk.on{background:var(--save);border-color:var(--save);color:#fff}
.tot{display:flex;justify-content:space-between;font-weight:600;padding:10px 0 6px;border-top:1px solid var(--line)}
.tag{font-size:.7rem;font-weight:700;border-radius:6px;padding:2px 6px;letter-spacing:.02em;white-space:nowrap}
.tag.pix{background:var(--pix-soft);color:var(--pix)} .tag.cred{background:var(--cred-soft);color:var(--cred)}
.empty{color:var(--muted);font-size:.9rem;padding:12px 0;text-align:center}

.fatura{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fatura summary{list-style:none;cursor:pointer;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--cred-soft)}
.fatura summary::-webkit-details-marker{display:none}
.fatura .in{padding:0 12px}
.fatura.paga summary{background:var(--surface2)}

.catrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.9rem;padding:6px 0}
.catrow .bar{grid-column:1/-1;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.catrow .bar span{display:block;height:100%;background:var(--accent)}
.catrow .bar span.over{background:var(--danger)}

.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:.95rem}
.kv .v{text-align:right;font-weight:600}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line)}
.kv .strong{font-weight:700}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.neg{color:var(--danger);font-weight:600} td.posv{color:var(--save);font-weight:600}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{padding:6px 10px;font-size:.85rem}
.btn.link{border:none;background:none;color:var(--accent);padding:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:1 1 auto}

input,select{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:16px}
[hidden]{display:none!important}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:.92rem;cursor:pointer;min-width:0}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px}
.seg label:has(input:checked){background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent)}
.hint{font-size:.85rem;color:var(--muted);background:var(--surface2);border-radius:8px;padding:8px 10px}
.hint:empty{display:none}
.alert{border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn)}
.alert.info{background:var(--accent-soft);border-color:var(--accent)}
.dupcard{padding:10px 12px;margin:0}
.duptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
li.dupl{display:flex;align-items:center;gap:10px;justify-content:space-between}
li.dupl .li-main{display:flex;flex-direction:column;min-width:0;flex:1}
li.dupl .btn{flex:none}
.divgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.divgrid{grid-template-columns:1fr 1fr}}
.divp h3{margin:0 0 4px;font-size:1.05rem}
.divp .list li,.card > .list.num li{display:flex;justify-content:space-between;gap:10px;padding:7px 0}
.divp .list li.tot{font-weight:700;border-top:1px solid var(--line)}
.divp b.neg{color:var(--danger)} .divp b.pos{color:var(--save)}
.acerto{background:var(--surface2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;margin-top:8px}
.acerto .big{font-size:1.3rem;font-weight:700}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:.93rem}

#fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;border:none;border-radius:999px;padding:14px 20px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1rem;box-shadow:0 6px 18px rgba(0,0,0,.22)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs button{border:none;background:none;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);border-radius:10px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}

dialog{border:none;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;margin:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92%;overflow-y:auto;background:var(--surface);color:var(--fg);border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:1.1rem}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:4px}
.sheet .acts .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--danger);font-size:.88rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;max-width:90vw;text-align:center}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles div{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 8px;display:flex;flex-direction:column;min-width:0}
.tiles span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.tiles b{font-size:clamp(.78rem,3.8vw,1.05rem);white-space:nowrap;letter-spacing:-.01em}
.tiles b small{font-size:.72em;font-weight:600;margin-right:1px}
.tiles b.pos{color:var(--save)} .tiles b.sv{color:var(--save)}
.nextcard{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;font-size:.92rem}
.nextcard .nv{white-space:nowrap}
.okcard{background:var(--save-soft);border-color:var(--save);color:var(--fg)}
.dobra summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:12px 0;font-weight:600}
.dobra summary::-webkit-details-marker{display:none}
.dobra summary span::before{content:"▸ ";color:var(--muted)}
.dobra[open] summary span::before{content:"▾ "}
.pos{color:var(--save)}
.donut{display:flex;flex-direction:column;align-items:center;gap:12px}
.donut svg{width:min(220px,70vw);height:auto}
.donut .dt{font-size:11px;fill:var(--muted)}
.donut .dv{font-size:17px;font-weight:700;fill:var(--fg)}
.dleg{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column}
.dleg li{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.dleg li:last-child{border-bottom:none}
.dleg i{width:12px;height:12px;border-radius:4px}
.dleg .t{min-width:0;overflow-wrap:anywhere}
.dleg .p{color:var(--muted);font-size:.82rem}
.bars{width:100%;height:auto;overflow:visible}
.bars .bx{font-size:11px;fill:var(--muted)}
.bars .bn{font-size:10.5px;font-weight:700}
.dleg li.abre{display:block;padding:0}
.dleg li.abre summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:12px 1fr auto auto 12px;gap:10px;align-items:center;padding:7px 0}
.dleg li.abre summary::-webkit-details-marker{display:none}
.dleg li.abre summary::after{content:"▸";color:var(--muted);font-size:.8rem}
.dleg li.abre details[open] summary::after{content:"▾"}
.dleg li.abre ul.list{margin:0 0 8px 22px;padding:0 10px;background:var(--surface2);border-radius:10px;font-size:.88rem}
.dleg li.abre ul.list li{display:flex;border-bottom:1px solid var(--line);padding:9px 0}
.dleg li.abre ul.list li:last-child{border-bottom:none}
</style>
</head>
<body>
<header class="top">
  <h1 id="titulo">Finanças da Casa</h1>
  <button class="sync" id="sync" type="button"><i></i><span id="syncTxt">Neste aparelho</span></button>
</header>
<main id="main" aria-live="polite"></main>
<button id="fab" type="button">+ Lançar</button>
<nav class="tabs" aria-label="Abas">
  <button type="button" data-tab="mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/></svg>Mês</button>
  <button type="button" data-tab="graficos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Gráficos</button>
  <button type="button" data-tab="divisao"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M4 7h16"/><path d="M4 7l-2.5 6a2.5 2.5 0 0 0 5 0z"/><path d="M20 7l-2.5 6a2.5 2.5 0 0 0 5 0z"/></svg>Divisão</button>
  <button type="button" data-tab="fixas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/><path d="M17 15.5l2 2 3-3.5"/></svg>Fixas</button>
  <button type="button" data-tab="planejar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V11M10 19V6M16 19v-5M21 19H3"/><path d="M14 8l3-3 3 3"/></svg>Planejar</button>
  <button type="button" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>
<dialog id="dlg"><form class="sheet" id="sheet" novalidate></form></dialog>
<div id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="drive.js"></script>
<script src="comprovante.js"></script>
<script src="app.js"></script>
<script>
// Atualização automática: confere versão nova ao abrir e ao voltar para o app; quando chega, recarrega uma vez.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const tinha = !!navigator.serviceWorker.controller;
  let recarregou = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (tinha && !recarregou) { recarregou = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    const checar = () => reg.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checar(); });
    setInterval(checar, 15 * 60 * 1000);
  }).catch(() => {});
}
</script>
</body>
</html>
